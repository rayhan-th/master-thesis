[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "talsim_lib"
version = "0.1.0"
description = "Talsim python utilities (lib.timeseries, lib.talsim)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]